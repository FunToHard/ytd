[package]
name = "github-auto-updater"
version = "0.1.0"
edition = "2021"
authors = ["FunToHard"]
description = "A lightweight, asynchronous auto-updater for Windows applications using GitHub Releases"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
hex = "0.4"
self-replace = "1.5"
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

