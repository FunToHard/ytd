name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0 or v1.0.0)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Determine release version
        id: get_version
        shell: pwsh
        run: |
          $ver = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
          } elseif ("${{ github.ref_name }}" -match '^v?(\d+\.\d+\.\d+.*)$') {
            $ver = $Matches[1]
          } else {
            $ver = "1.0.0"
          }
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$ver" }
          Write-Host "Determined Version: $ver"
          Write-Host "Determined Tag: $tag"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Run test suite
        run: cargo test --verbose

      - name: Compile Release Daemon
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "iscc"
          }
          & $iscc /DMyAppVersion="${{ steps.get_version.outputs.version }}" installer\ytd_setup.iss

      - name: Assemble Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # 1. Standalone Inno Setup Installer
          if (Test-Path "target\installer\YTD-Setup.exe") {
            Copy-Item "target\installer\YTD-Setup.exe" -Destination "artifacts\YTD-Setup.exe"
          } else {
            Write-Error "target\installer\YTD-Setup.exe not found!"
            exit 1
          }

          # 2. Portable Daemon Archive
          New-Item -ItemType Directory -Force -Path "target\portable\ytd"
          Copy-Item "target\release\ytd-daemon.exe" -Destination "target\portable\ytd\"
          Copy-Item "README.md" -Destination "target\portable\ytd\"
          Copy-Item "LICENSE" -Destination "target\portable\ytd\"
          Copy-Item "daemon\resources\app-icon.ico" -Destination "target\portable\ytd\"
          Compress-Archive -Path "target\portable\ytd\*" -DestinationPath "artifacts\ytd-daemon-windows-x86_64.zip" -Force

          # 3. Browser Extension Package
          Compress-Archive -Path "extension\*" -DestinationPath "artifacts\ytd-extension.zip" -Force

          # 4. Generate SHA256 Checksums
          Get-ChildItem -Path "artifacts\*" -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "artifacts\SHA256SUMS.txt"

          Get-Content "artifacts\SHA256SUMS.txt"

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: ytd-build-artifacts
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
