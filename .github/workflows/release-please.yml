name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (PR & Tag)
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    name: Build & Publish Release Artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.releases_created == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --verbose

      - name: Compile Release Daemon
        run: |
          cargo check
          cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "iscc"
          }
          & $iscc /DMyAppVersion="${{ needs.release-please.outputs.version }}" installer\ytd_setup.iss

      - name: Assemble Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # 1. Standalone Inno Setup Installer
          if (Test-Path "target\installer\YTD-Setup.exe") {
            Copy-Item "target\installer\YTD-Setup.exe" -Destination "artifacts\YTD-Setup.exe"
          } else {
            Write-Error "target\installer\YTD-Setup.exe not found!"
            exit 1
          }

          # 2. Portable Daemon Archive
          New-Item -ItemType Directory -Force -Path "target\portable\ytd"
          Copy-Item "target\release\ytd-daemon.exe" -Destination "target\portable\ytd\"
          Copy-Item "README.md" -Destination "target\portable\ytd\"
          Copy-Item "LICENSE" -Destination "target\portable\ytd\"
          Copy-Item "daemon\resources\app-icon.ico" -Destination "target\portable\ytd\"
          Compress-Archive -Path "target\portable\ytd\*" -DestinationPath "artifacts\ytd-daemon-windows-x86_64.zip" -Force

          # 3. Browser Extension Package
          Compress-Archive -Path "extension\*" -DestinationPath "artifacts\ytd-extension.zip" -Force

          # 4. Generate SHA256 Checksums
          Get-ChildItem -Path "artifacts\*" -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "artifacts\SHA256SUMS.txt"

          Get-Content "artifacts\SHA256SUMS.txt"

      - name: Attach Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ needs.release-please.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
